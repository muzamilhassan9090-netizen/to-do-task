
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow | To-Do List</title>

<style>
:root{
  --primary:#6258d9;
  --primary-dark:#5046bf;
  --text:#292b3a;
  --muted:#777b89;
  --border:#e8e9f0;
  --background:#f7f8fc;
  --white:#ffffff;
  --todo:#eee8ff;
  --progress:#def3f5;
  --done:#e5f5dc;
  --danger:#dc4558;
  --shadow:0 5px 20px rgba(35,35,65,.06);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--background);
  color:var(--text);
  line-height:1.5;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--primary);
  outline-offset:3px;
}
svg{width:18px;height:18px;flex-shrink:0}
button svg{pointer-events:none}
.topbar{
  height:70px;background:white;border-bottom:1px solid var(--border);
  padding:0 28px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:5;
}
.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800}
.brand-icon{
  width:37px;height:37px;display:grid;place-items:center;
  border-radius:11px;background:var(--primary);color:white;
}
.brand-icon svg{width:23px;height:23px}
.top-right{display:flex;align-items:center;gap:14px}
.avatar{
  width:36px;height:36px;display:grid;place-items:center;
  background:#e9e6ff;color:var(--primary);border-radius:50%;font-weight:bold;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--border);background:white;color:var(--text);
  padding:10px 14px;border-radius:9px;font-size:12px;font-weight:700;
  transition:background .2s,color .2s,border-color .2s,box-shadow .2s,transform .2s;
}
.btn:hover{background:#f1efff;border-color:#d5d0ff;transform:translateY(-2px);box-shadow:0 5px 12px #292b3a12}
.btn:active{transform:scale(.97)}
.primary{background:var(--primary);border-color:var(--primary);color:white}
.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);color:white}
main{max-width:1550px;margin:auto;padding:28px;animation:pageIn .35s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px;gap:15px}
.heading h1{font-size:27px;margin:0 0 5px}
.heading p{font-size:13px;color:var(--muted);margin:0}
.toolbar{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--border);margin-bottom:24px;
}
.tabs{display:flex;gap:6px}
.tab{
  display:flex;align-items:center;gap:8px;padding:13px 12px;
  background:transparent;border:0;border-bottom:3px solid transparent;
  color:var(--muted);font-size:12px;font-weight:700;transition:.2s;
}
.tab:hover{color:var(--primary);background:#f0eeff;border-radius:7px 7px 0 0}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.controls{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:9px}
.search,.controls select{
  height:39px;padding:0 11px;background:white;border:1px solid var(--border);
  border-radius:9px;color:var(--text);font-size:12px;
}
.search{width:210px}
.search:focus,.controls select:focus,.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:#9188ed;box-shadow:0 0 0 3px #6258d918;
}
.view{display:none}
.view.active{display:block}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:start}
.column{min-width:0}
.column-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 15px;border-radius:11px;margin-bottom:16px;border:1px solid transparent;
  transition:border-color .2s;
}
.column-head h2{font-size:15px;margin:0}
.count{font-size:12px;color:#777;margin-left:5px}
.todo-head{background:var(--todo)}
.progress-head{background:var(--progress)}
.done-head{background:var(--done)}
.todo-head:hover{border-color:#d5c9ff}
.progress-head:hover{border-color:#b8e5e8}
.done-head:hover{border-color:#c6e6b8}
.add-col{
  width:29px;height:29px;display:grid;place-items:center;
  background:#ffffffc9;color:var(--text);border:0;border-radius:50%;transition:.2s;
}
.add-col:hover{background:var(--primary);color:white;transform:rotate(90deg)}
.column-list{display:grid;gap:14px;min-height:100px;border-radius:11px}
.column-list.over{outline:2px dashed var(--primary);outline-offset:3px;background:#f0eeff}
.task-card{
  min-width:0;background:white;border:1px solid var(--border);
  border-radius:12px;padding:16px;box-shadow:0 2px 7px #292b3a08;
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.task-card:hover{transform:translateY(-3px);border-color:#d4cff8;box-shadow:0 10px 24px #292b3a10}
.task-card.dragging{opacity:.45}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.category{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.cat-design{color:#d57953}
.cat-development{color:#7161ce}
.cat-marketing{color:#218e9a}
.cat-planning{color:#b05cb8}
.cat-other{color:#687083}
.icon-btn{
  width:32px;height:32px;display:grid;place-items:center;background:white;
  border:1px solid var(--border);border-radius:8px;color:#777b89;
  transition:background .2s,color .2s,transform .2s,border-color .2s;
}
.icon-btn:hover{color:var(--primary);background:#f0eeff;border-color:#dcd7ff}
.icon-btn:active{transform:scale(.94)}
.menu-wrap{position:relative}
.menu{
  display:none;position:absolute;right:0;top:35px;width:140px;z-index:4;
  background:white;border:1px solid var(--border);box-shadow:0 10px 28px #292b3a18;
  border-radius:9px;padding:5px;
}
.menu.open{display:grid;animation:pageIn .15s ease}
.menu button{
  display:flex;align-items:center;gap:8px;border:0;background:white;
  padding:9px;border-radius:6px;text-align:left;color:var(--text);font-size:12px;
}
.menu button:hover{background:#f0eeff;color:var(--primary)}
.menu button.danger{color:var(--danger)}
.menu button.danger:hover{background:#fff0f2}
.menu button svg{width:15px;height:15px}
.task-title{font-size:14px;font-weight:700;line-height:1.5;margin:0 0 5px;overflow-wrap:anywhere;transition:color .2s}
.task-card:hover .task-title{color:var(--primary-dark)}
.project{font-size:11px;color:var(--muted);margin-bottom:12px}
.description{font-size:12px;color:#73778b;line-height:1.65;margin:0 0 13px;white-space:pre-wrap;overflow-wrap:anywhere}
.badges{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:15px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:6px 8px;border-radius:6px;font-size:10px;font-weight:700}
.badge svg{width:13px;height:13px}
.high{background:#fff0f1;color:#cf4859}
.medium{background:#fff4e4;color:#b97b24}
.low{background:#e8f6e4;color:#3e8c40}
.late{background:#fff0f1;color:#cf4859}
.today{background:#fff4e4;color:#b97b24}
.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}
.status-select{
  max-width:65%;width:125px;padding:7px 5px;border:1px solid var(--border);
  border-radius:7px;background:white;color:var(--text);font-size:11px;cursor:pointer;
}
.status-select:hover{border-color:#c7c1f7;background:#faf9ff}
.card-actions{display:flex;gap:5px}
.empty{
  padding:25px 10px;border:1px dashed #dcddeb;border-radius:11px;
  text-align:center;color:var(--muted);font-size:12px;line-height:1.8;
}
.table-wrap{overflow-x:auto;background:white;border:1px solid var(--border);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:650px}
th,td{padding:15px;text-align:left;border-bottom:1px solid var(--border);font-size:12px}
th{background:#fafaff;color:var(--muted)}
tbody tr{transition:background .2s}
tbody tr:hover{background:#faf9ff}
tbody tr:last-child td{border-bottom:0}
.table-task{font-weight:700}
.table-actions{display:flex;gap:5px}
.calendar{padding:18px;background:white;border:1px solid var(--border);border-radius:12px}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.calendar-head h2{font-size:17px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day-name{text-align:center;color:var(--muted);font-size:11px;font-weight:bold;padding:12px 3px}
.day{min-height:95px;min-width:0;padding:7px 5px;border-top:1px solid var(--border);border-right:1px solid var(--border)}
.day:nth-child(7n){border-right:0}
.day-number{font-size:11px;margin-bottom:7px}
.day-number.current{width:24px;height:24px;display:grid;place-items:center;background:var(--primary);color:white;border-radius:50%}
.calendar-task{
  display:block;width:100%;text-align:left;border:0;border-radius:5px;
  padding:5px;margin-bottom:4px;font-size:10px;line-height:1.4;overflow-wrap:anywhere;
  background:#eeeaff;color:#5748bd;transition:transform .18s,box-shadow .18s;
}
.calendar-task.progress{background:#def4f6;color:#217e87}
.calendar-task.done{background:#e3f5da;color:#388239}
.calendar-task:hover{transform:translateY(-1px);box-shadow:0 3px 8px #292b3a12}
.modal-backdrop{
  display:none;position:fixed;inset:0;z-index:10;background:#19182f80;
  align-items:center;justify-content:center;padding:16px;
}
.modal-backdrop.open{display:flex}
.modal{
  width:100%;max-width:500px;max-height:90vh;overflow:auto;background:white;
  padding:24px;border-radius:15px;box-shadow:0 20px 70px #17172d24;
  animation:modalIn .2s ease;
}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.modal-head h2{margin:0;font-size:20px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}
.field input,.field select,.field textarea{
  width:100%;border:1px solid #dedfeb;border-radius:9px;padding:12px;
  background:white;color:var(--text);transition:border-color .2s,box-shadow .2s;
}
.field input::placeholder,.field textarea::placeholder{color:#9295a4;opacity:1}
.field textarea{min-height:80px;resize:vertical}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.toast{
  position:fixed;bottom:22px;right:22px;background:#29283d;color:white;
  padding:13px 18px;border-radius:10px;z-index:20;display:none;
  max-width:calc(100% - 44px);box-shadow:0 8px 25px #17172d20;
}
.toast.show{display:block;animation:pageIn .2s ease}
@media(max-width:900px){
  main{padding:20px}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .column:last-child{grid-column:1/-1}
  .column:last-child .column-list{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:600px){
  .topbar{padding:0 13px;height:62px}
  main{padding:20px 13px}
  .heading h1{font-size:24px}
  .board{grid-template-columns:1fr;gap:22px}
  .column:last-child{grid-column:auto}
  .column:last-child .column-list{grid-template-columns:1fr}
  .toolbar{align-items:stretch}
  .tabs{justify-content:space-between}
  .tab{padding:12px 7px}
  .controls{width:100%}
  .search{width:100%;flex:1}
  .controls select{flex:1;max-width:48%}
  .day{min-height:70px;padding:4px 2px}
  .calendar{padding:9px 4px}
  .day-name{font-size:9px}
  .calendar-task{font-size:9px;padding:3px}
  .form-grid{grid-template-columns:1fr}
  .modal{padding:19px}
}
@media(hover:none){
  .task-card:hover,.btn:hover{transform:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-icon" id="brandIcon"></span>
    TaskFlow
  </div>
  <div class="top-right">
    <button class="btn primary" id="addTop"></button>
    <div class="avatar" title="Your profile">T</div>
  </div>
</header>

<main>
  <div class="heading">
    <div>
      <h1>Tasks</h1>
      <p>Organize your work and get things done.</p>
    </div>
  </div>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab active" data-view="board">Board</button>
      <button class="tab" data-view="table">Table</button>
      <button class="tab" data-view="calendar">Calendar</button>
    </div>
    <div class="controls">
      <input class="search" id="search" type="search" placeholder="Search tasks...">
      <select id="filter" aria-label="Filter by priority">
        <option value="all">All priorities</option>
        <option value="high">High priority</option>
        <option value="medium">Medium priority</option>
        <option value="low">Low priority</option>
      </select>
      <select id="sort" aria-label="Sort tasks">
        <option value="newest">Newest first</option>
        <option value="due">Due date</option>
        <option value="title">Task title</option>
        <option value="priority">Priority</option>
      </select>
    </div>
  </div>

  <section class="view active" id="boardView">
    <div class="board">
      <section class="column">
        <div class="column-head todo-head">
          <h2>To - Do <span class="count" id="countTodo"></span></h2>
          <button class="add-col" data-add="todo" aria-label="Add To-Do task"></button>
        </div>
        <div class="column-list" id="todoList" data-status="todo"></div>
      </section>

      <section class="column">
        <div class="column-head progress-head">
          <h2>In Progress <span class="count" id="countProgress"></span></h2>
          <button class="add-col" data-add="progress" aria-label="Add In Progress task"></button>
        </div>
        <div class="column-list" id="progressList" data-status="progress"></div>
      </section>

      <section class="column">
        <div class="column-head done-head">
          <h2>Done <span class="count" id="countDone"></span></h2>
          <button class="add-col" data-add="done" aria-label="Add completed task"></button>
        </div>
        <div class="column-list" id="doneList" data-status="done"></div>
      </section>
    </div>
  </section>

  <section class="view" id="tableView">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Task</th><th>Category</th><th>Priority</th><th>Due date</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </section>

  <section class="view" id="calendarView">
    <div class="calendar">
      <div class="calendar-head">
        <button class="icon-btn" id="prevMonth" aria-label="Previous month"></button>
        <h2 id="monthTitle"></h2>
        <button class="icon-btn" id="nextMonth" aria-label="Next month"></button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </section>
</main>

<div class="modal-backdrop" id="backdrop">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">Create task</h2>
      <button class="icon-btn" id="closeModal" aria-label="Close"></button>
    </div>
    <form id="taskForm">
      <div class="field">
        <label for="title">Task title *</label>
        <input id="title" maxlength="120" required placeholder="e.g. Build a portfolio website">
      </div>

      <div class="form-grid">
        <div class="field">
          <label for="category">Category</label>
          <select id="category">
            <option>Design</option><option>Development</option><option>Marketing</option><option>Planning</option><option>Other</option>
          </select>
        </div>
        <div class="field">
          <label for="priority">Priority</label>
          <select id="priority">
            <option value="medium">Medium</option><option value="high">High</option><option value="low">Low</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="project">Project / Client</label>
        <input id="project" maxlength="100" placeholder="Project name">
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" maxlength="500" placeholder="Task details..."></textarea>
      </div>

      <div class="form-grid">
        <div class="field">
          <label for="dueDate">Due date</label>
          <input type="date" id="dueDate">
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status">
            <option value="todo">To - Do</option><option value="progress">In Progress</option><option value="done">Done</option>
          </select>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn" type="button" id="cancelModal">Cancel</button>
        <button class="btn primary" type="submit" id="saveBtn">Create task</button>
      </div>
    </form>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const SVG = {
  check:'<path d="m5 12 4 4L19 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  board:'<rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/>',
  table:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16M15 10v10"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18M8 15h2M14 15h2"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L9 17l-4 1 1-4Z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/>',
  more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  flag:'<path d="M5 21V5m0 0c7-5 9 5 15 0v11c-6 5-8-5-15 0"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  left:'<path d="m15 18-6-6 6-6"/>',
  right:'<path d="m9 18 6-6-6-6"/>',
  close:'<path d="m18 6-12 12M6 6l12 12"/>',
  move:'<path d="M12 3v18m-6-6 6 6 6-6M6 9l6-6 6 6"/>'
};

function icon(name){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SVG[name]||SVG.check}</svg>`;
}

$("brandIcon").innerHTML=icon("check");
$("addTop").innerHTML=icon("plus")+" Add Task";
document.querySelectorAll("[data-view]").forEach(b=>{
  b.insertAdjacentHTML("afterbegin",icon(b.dataset.view==="board"?"board":b.dataset.view==="table"?"table":"calendar"));
});
document.querySelectorAll("[data-add]").forEach(b=>b.innerHTML=icon("plus"));
$("prevMonth").innerHTML=icon("left");
$("nextMonth").innerHTML=icon("right");
$("closeModal").innerHTML=icon("close");

const STORAGE="taskflow_human_style_v3";
const names={todo:"To - Do",progress:"In Progress",done:"Done"};
let tasks=[];
let editingId=null;
let toastTimer;
let month=new Date(new Date().getFullYear(),new Date().getMonth(),1);

function uid(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,9);
}
function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function sampleTasks(){
  return [
    {title:"Customer Journey Mapping",category:"Design",project:"Kidszone",description:"Map the customer journey and identify areas to improve.",priority:"medium",dueDate:"",status:"todo"},
    {title:"UI Component Modification",category:"Design",project:"Bookly",description:"Improve micro-interactions, loading and progress states.",priority:"medium",dueDate:"",status:"todo"},
    {title:"Database Customization",category:"Development",project:"Uber",description:"Customize the database for internal systems.",priority:"medium",dueDate:"",status:"progress"},
    {title:"Fix Interior Planning",category:"Planning",project:"Hotel Nice",description:"Address layout and functional issues.",priority:"low",dueDate:"",status:"progress"},
    {title:"Redesign WordPress Website",category:"Design",project:"Design Lab",description:"Improve website usability and visual appeal.",priority:"high",dueDate:"",status:"done"},
    {title:"Facebook Ads Campaign",category:"Marketing",project:"Plantify",description:"Prepare the campaign assets and launch checklist.",priority:"medium",dueDate:"",status:"done"}
  ].map((t,i)=>({...t,id:uid(),createdAt:Date.now()-i}));
}
function load(){
  try{
    const raw=localStorage.getItem(STORAGE);
    if(raw===null)return sampleTasks();
    const data=JSON.parse(raw);
    if(!Array.isArray(data))return [];
    return data.filter(t=>t&&typeof t.id==="string"&&typeof t.title==="string"&&names[t.status]);
  }catch(e){
    return sampleTasks();
  }
}
tasks=load();

function save(){
  try{
    localStorage.setItem(STORAGE,JSON.stringify(tasks));
    return true;
  }catch(e){
    notify("Unable to save. Check your browser storage.");
    return false;
  }
}
function notify(message){
  $("toast").textContent=message;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2400);
}
function dateText(d){
  if(!d)return "";
  const date=new Date(d+"T12:00:00");
  return Number.isNaN(date.getTime())?"":date.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
}
function priorityLabel(p){
  return ({high:"High",medium:"Medium",low:"Low"})[p]||"Medium";
}
function priorityRank(p){
  return ({high:3,medium:2,low:1})[p]||2;
}
function filtered(){
  const q=$("search").value.trim().toLowerCase();
  const p=$("filter").value;
  const arr=tasks.filter(t=>
    [t.title,t.category,t.project,t.description].join(" ").toLowerCase().includes(q)&&
    (p==="all"||t.priority===p)
  );
  const sort=$("sort").value;
  arr.sort((a,b)=>{
    if(sort==="title")return a.title.localeCompare(b.title);
    if(sort==="due")return (a.dueDate||"9999").localeCompare(b.dueDate||"9999");
    if(sort==="priority")return priorityRank(b.priority)-priorityRank(a.priority);
    return (b.createdAt||0)-(a.createdAt||0);
  });
  return arr;
}
function dueClass(t){
  if(!t.dueDate||t.status==="done")return "";
  const d=new Date();
  const today=[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
  if(t.dueDate<today)return "late";
  if(t.dueDate===today)return "today";
  return "";
}
function catClass(c){
  const v=(c||"other").toLowerCase();
  return ["design","development","marketing","planning"].includes(v)?"cat-"+v:"cat-other";
}

function taskCard(t){
  return `<article class="task-card" draggable="true" data-id="${esc(t.id)}">
    <div class="card-top">
      <span class="category ${catClass(t.category)}">${esc(t.category||"Other")}</span>
      <div class="menu-wrap">
        <button type="button" class="icon-btn" data-action="menu" aria-label="More task options">${icon("more")}</button>
        <div class="menu">
          <button type="button" data-action="edit">${icon("edit")} Edit</button>
          <button type="button" data-action="move">${icon("move")} Move</button>
          <button type="button" class="danger" data-action="delete">${icon("trash")} Delete</button>
        </div>
      </div>
    </div>
    <h3 class="task-title">${esc(t.title)}</h3>
    ${t.project?`<div class="project">${esc(t.project)}</div>`:""}
    ${t.description?`<p class="description">${esc(t.description)}</p>`:""}
    <div class="badges">
      <span class="badge ${esc(t.priority)}">${icon("flag")}${priorityLabel(t.priority)}</span>
      ${t.dueDate?`<span class="badge ${dueClass(t)}">${icon("clock")}${esc(dateText(t.dueDate))}</span>`:""}
    </div>
    <div class="card-bottom">
      <select class="status-select" data-action="status" aria-label="Change task status">
        ${Object.entries(names).map(([k,v])=>`<option value="${k}" ${t.status===k?"selected":""}>${v}</option>`).join("")}
      </select>
      <div class="card-actions">
        <button type="button" class="icon-btn" data-action="edit" aria-label="Edit task">${icon("edit")}</button>
        <button type="button" class="icon-btn" data-action="delete" aria-label="Delete task">${icon("trash")}</button>
      </div>
    </div>
  </article>`;
}

function renderBoard(){
  const ids={todo:"todoList",progress:"progressList",done:"doneList"};
  for(const s of Object.keys(names)){
    const list=filtered().filter(t=>t.status===s);
    $(ids[s]).innerHTML=list.length?list.map(taskCard).join():
      `<div class="empty">${$("search").value?"No matching tasks":"No tasks yet"}<br>Click + to add one.</div>`;
    $("count"+s[0].toUpperCase()+s.slice(1)).textContent="("+tasks.filter(t=>t.status===s).length+")";
  }
}
function renderTable(){
  const arr=filtered();
  $("tableBody").innerHTML=arr.length?arr.map(t=>`<tr data-id="${esc(t.id)}">
    <td class="table-task">${esc(t.title)}</td>
    <td>${esc(t.category||"Other")}</td>
    <td><span class="badge ${esc(t.priority)}">${priorityLabel(t.priority)}</span></td>
    <td>${esc(dateText(t.dueDate)||"—")}</td>
    <td><select class="status-select" data-action="status" aria-label="Change task status">${Object.entries(names).map(([k,v])=>`<option value="${k}" ${t.status===k?"selected":""}>${v}</option>`).join("")}</select></td>
    <td><div class="table-actions">
      <button type="button" class="icon-btn" data-action="edit" aria-label="Edit">${icon("edit")}</button>
      <button type="button" class="icon-btn" data-action="delete" aria-label="Delete">${icon("trash")}</button>
    </div></td>
  </tr>`).join(""):`<tr><td colspan="6">No matching tasks.</td></tr>`;
}
function renderCalendar(){
  const y=month.getFullYear(),m=month.getMonth();
  $("monthTitle").textContent=month.toLocaleDateString("en-US",{month:"long",year:"numeric"});
  let html=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="day-name">${d}</div>`).join("");
  const first=new Date(y,m,1).getDay();
  const total=new Date(y,m+1,0).getDate();
  const now=new Date();
  for(let i=0;i<first;i++)html+='<div class="day"></div>';
  for(let n=1;n<=total;n++){
    const date=`${y}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`;
    const today=y===now.getFullYear()&&m===now.getMonth()&&n===now.getDate();
    html+=`<div class="day"><div class="day-number ${today?"current":""}">${n}</div>`;
    filtered().filter(t=>t.dueDate===date).forEach(t=>{
      html+=`<button type="button" class="calendar-task ${esc(t.status)}" data-edit-id="${esc(t.id)}">${esc(t.title)}</button>`;
    });
    html+="</div>";
  }
  const rest=(first+total)%7;
  if(rest)for(let i=0;i<7-rest;i++)html+='<div class="day"></div>';
  $("calendarGrid").innerHTML=html;
}
function render(){
  renderBoard();
  renderTable();
  renderCalendar();
}

function openModal(status="todo",task=null){
  editingId=task?task.id:null;
  $("taskForm").reset();
  $("modalTitle").textContent=task?"Edit task":"Create task";
  $("saveBtn").textContent=task?"Save changes":"Create task";
  $("status").value=task?task.status:status;

  if(task){
    $("title").value=task.title;
    $("category").value=task.category||"Other";
    $("project").value=task.project||"";
    $("description").value=task.description||"";
    $("priority").value=task.priority||"medium";
    $("dueDate").value=task.dueDate||"";
  }

  $("backdrop").classList.add("open");
  setTimeout(()=>$("title").focus(),50);
}
function closeModal(){
  $("backdrop").classList.remove("open");
  editingId=null;
}

$("taskForm").addEventListener("submit",e=>{
  e.preventDefault();
  const title=$("title").value.trim();
  if(!title){$("title").focus();return;}

  const data={
    title,
    category:$("category").value,
    project:$("project").value.trim(),
    description:$("description").value.trim(),
    priority:$("priority").value,
    dueDate:$("dueDate").value,
    status:$("status").value
  };
  const before=tasks.map(t=>({...t}));
  const wasEditing=Boolean(editingId);

  if(wasEditing){
    const task=tasks.find(t=>t.id===editingId);
    if(!task)return;
    Object.assign(task,data);
  }else{
    tasks.unshift({id:uid(),...data,createdAt:Date.now()});
  }

  if(!save()){tasks=before;return;}
  closeModal();
  render();
  notify(wasEditing?"Task updated successfully":"Task created successfully");
});

function performAction(target){
  const row=target.closest("[data-id]");
  if(!row)return;
  const task=tasks.find(t=>t.id===row.dataset.id);
  if(!task)return;

  const action=target.dataset.action;
  if(action==="menu"){
    const menu=target.parentElement.querySelector(".menu");
    const opening=!menu.classList.contains("open");
    document.querySelectorAll(".menu.open").forEach(m=>m.classList.remove("open"));
    if(opening)menu.classList.add("open");
    return;
  }
  if(action==="edit"){
    openModal(task.status,task);
    return;
  }
  if(action==="delete"){
    if(!confirm(`Delete "${task.title}"?`))return;
    const before=tasks;
    tasks=tasks.filter(t=>t.id!==task.id);
    if(!save()){tasks=before;return;}
    render();
    notify("Task deleted");
    return;
  }
  if(action==="move"){
    const states=["todo","progress","done"];
    task.status=states[(states.indexOf(task.status)+1)%states.length];
    if(!save())return;
    render();
    notify("Moved to "+names[task.status]);
    return;
  }
  if(action==="status"){
    const old=task.status;
    task.status=target.value;
    if(!save()){task.status=old;render();return;}
    render();
    notify("Task status updated");
  }
}

$("boardView").addEventListener("click",e=>{
  const target=e.target.closest("[data-action]");
  if(target&&target.tagName!=="SELECT")performAction(target);
});
$("tableView").addEventListener("click",e=>{
  const target=e.target.closest("[data-action]");
  if(target&&target.tagName!=="SELECT")performAction(target);
});
$("boardView").addEventListener("change",e=>{
  const target=e.target.closest('[data-action="status"]');
  if(target)performAction(target);
});
$("tableView").addEventListener("change",e=>{
  const target=e.target.closest('[data-action="status"]');
  if(target)performAction(target);
});

document.addEventListener("click",e=>{
  if(!e.target.closest(".menu-wrap")){
    document.querySelectorAll(".menu.open").forEach(m=>m.classList.remove("open"));
  }
});

document.querySelectorAll("[data-add]").forEach(b=>{
  b.addEventListener("click",()=>openModal(b.dataset.add));
});
$("addTop").addEventListener("click",()=>openModal("todo"));
$("closeModal").addEventListener("click",closeModal);
$("cancelModal").addEventListener("click",closeModal);
$("backdrop").addEventListener("click",e=>{
  if(e.target===$("backdrop"))closeModal();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeModal();
});

document.querySelectorAll("[data-view]").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("active",x===b));
    document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
    $(b.dataset.view+"View").classList.add("active");
  });
});

$("search").addEventListener("input",render);
$("filter").addEventListener("change",render);
$("sort").addEventListener("change",render);

$("prevMonth").addEventListener("click",()=>{
  month=new Date(month.getFullYear(),month.getMonth()-1,1);
  renderCalendar();
});
$("nextMonth").addEventListener("click",()=>{
  month=new Date(month.getFullYear(),month.getMonth()+1,1);
  renderCalendar();
});
$("calendarGrid").addEventListener("click",e=>{
  const b=e.target.closest("[data-edit-id]");
  if(!b)return;
  const task=tasks.find(t=>t.id===b.dataset.editId);
  if(task)openModal(task.status,task);
});

// Drag and drop between columns
document.querySelectorAll(".column-list").forEach(list=>{
  list.addEventListener("dragover",e=>{
    e.preventDefault();
    list.classList.add("over");
  });
  list.addEventListener("dragleave",e=>{
    if(!list.contains(e.relatedTarget))list.classList.remove("over");
  });
  list.addEventListener("drop",e=>{
    e.preventDefault();
    list.classList.remove("over");
    const task=tasks.find(t=>t.id===e.dataTransfer.getData("text/plain"));
    if(!task||task.status===list.dataset.status)return;
    const old=task.status;
    task.status=list.dataset.status;
    if(!save()){task.status=old;render();return;}
    render();
    notify("Task moved to "+names[task.status]);
  });
});
$("boardView").addEventListener("dragstart",e=>{
  const card=e.target.closest(".task-card");
  if(!card||e.target.closest("button,select")){
    e.preventDefault();
    return;
  }
  e.dataTransfer.setData("text/plain",card.dataset.id);
  e.dataTransfer.effectAllowed="move";
  card.classList.add("dragging");
});
$("boardView").addEventListener("dragend",e=>{
  const card=e.target.closest(".task-card");
  if(card)card.classList.remove("dragging");
  document.querySelectorAll(".over").forEach(el=>el.classList.remove("over"));
});

render();
</script>
</body>
</html>
